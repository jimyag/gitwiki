version: "3"

tasks:
  default:
    cmds: [task --list-all]
    silent: true

  dev:
    desc: Start backend + frontend dev server in parallel
    deps: [dev-backend, dev-frontend]

  dev-backend:
    cmds: [go run ./cmd/gitwiki -config config.yaml]

  dev-frontend:
    cmds: [cd web && bun run dev]

  deps:
    desc: Install development tools
    cmds:
      - cd web && bun install

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  test:
    desc: Run backend tests with coverage
    cmds:
      - go test -race -coverprofile=coverage.txt ./...

  check:
    desc: Typecheck + vet
    cmds:
      - cd web && bun run typecheck
      - go vet ./...

  build:
    desc: Build frontend and backend binary
    cmds:
      - cd web && bun install --frozen-lockfile
      - cd web && bun run build
      - go build -trimpath -ldflags "-s -w" -o gitwiki ./cmd/gitwiki

  release-snapshot:
    desc: Run GoReleaser in snapshot mode to validate release artifacts locally
    cmds:
      - goreleaser release --snapshot --clean

  clean:
    cmds:
      - rm -rf web/dist web/node_modules gitwiki coverage.txt dist
